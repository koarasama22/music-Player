<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Music Player - シンプル音楽プレイヤー</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171c26;
    --panel-2: #1f2633;
    --text: #e8ecf3;
    --muted: #8b95a7;
    --accent: #4fd1c5;
    --accent-2: #7f9cf5;
    --danger: #f56565;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  button, select, input { font: inherit; }

  .player { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }

  .player-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .player-header h1 { font-size: 1.35rem; margin: 0; letter-spacing: .02em; }
  .player-header h1 span { color: var(--accent); }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 10px; border: 1px solid #2c3546;
    background: var(--panel-2); color: var(--text); cursor: pointer; transition: background .15s, border-color .15s, transform .05s; user-select: none; }
  .btn:hover { background: #283142; border-color: #3b475d; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0b0f16; border: none; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

  .drop-zone { border: 2px dashed #34405a; border-radius: var(--radius); padding: 22px 16px; text-align: center; background: var(--panel);
    transition: border-color .15s, background .15s, padding .2s; }
  .drop-zone.dragover { border-color: var(--accent); background: #1a2a2e; }
  .drop-zone p { margin: 0 0 12px; color: var(--muted); }
  .upload-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .status { margin-top: 12px !important; font-size: .9rem; min-height: 1.2em; color: var(--accent) !important; word-break: break-all; }
  /* Compact state once tracks exist: free up space for the metronome / now-playing panels */
  .drop-zone.has-tracks { padding: 10px 14px; border-style: solid; border-width: 1px; border-color: #243043; }
  .drop-zone.has-tracks .drop-hint { display: none; }
  .drop-zone.has-tracks .upload-buttons { justify-content: flex-start; gap: 8px; }
  .drop-zone.has-tracks .btn { padding: 6px 10px; font-size: .82rem; }
  .drop-zone.has-tracks .status:empty { margin-top: 6px !important; min-height: 0; }

  .now-playing { margin-top: 16px; background: var(--panel); border-radius: var(--radius); padding: 14px; }
  #spectrum { display: block; width: 100%; height: 180px; border-radius: 10px; background: #0b0e14; }
  .track-title { margin-top: 12px; font-size: 1.05rem; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-sub { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 4px; min-height: 1.1em; }

  .controls { margin-top: 12px; background: var(--panel); border-radius: var(--radius); padding: 14px; }
  .seek-row { display: flex; align-items: center; gap: 10px; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; min-width: 44px; text-align: center; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: #2b3444; border-radius: 3px; outline: none; cursor: pointer; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid #0b0f16; }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid #0b0f16; }

  .button-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .icon-btn { width: 46px; height: 46px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1.15rem; padding: 0; }
  .icon-btn.big { width: 62px; height: 62px; font-size: 1.5rem; }

  .option-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
  .option { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }
  .option select { background: var(--panel-2); color: var(--text); border: 1px solid #2c3546; border-radius: 8px; padding: 6px 8px; }
  .option input[type="range"] { width: 130px; }
  .kbd-hint { margin-top: 12px; text-align: center; color: var(--muted); font-size: .75rem; }
  kbd { background: #2b3444; padding: 1px 6px; border-radius: 4px; font-family: inherit; }

  .metronome { margin-top: 12px; background: var(--panel); border-radius: var(--radius); padding: 18px 16px;
    border: 2px solid #2f3b52; box-shadow: 0 0 0 1px rgba(79,209,197,.08); }
  .metronome-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .metronome-header { color: var(--text); font-size: 1.1rem; font-weight: 700; letter-spacing: .02em; }
  #metro-settings-toggle { padding: 6px 12px; font-size: .85rem; }
  .metronome-row { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .metronome-row .option { gap: 6px; }
  .time-sep { color: var(--muted); }
  #beats-select, #note-value-select, #advance-mode-select { background: var(--panel-2); color: var(--text); border: 1px solid #2c3546; border-radius: 8px; padding: 6px 6px; }
  .metronome select:disabled, .metronome input:disabled { opacity: .45; cursor: not-allowed; }

  .program-status { text-align: center; color: var(--accent); font-size: 1rem; min-height: 1.4em; margin: 4px 0; font-weight: 600; }
  .beat-dots { display: flex; justify-content: center; gap: 12px; margin: 10px 0 16px; flex-wrap: wrap; }
  .beat-dot { width: 22px; height: 22px; border-radius: 50%; background: #2b3444; transition: background .04s, transform .06s, box-shadow .08s; }
  .beat-dot.accent { box-shadow: 0 0 0 2px #4a5570 inset; }
  .beat-dot.on { background: var(--accent-2); transform: scale(1.4); box-shadow: 0 0 14px 2px rgba(127,156,245,.8); }
  .beat-dot.accent.on { background: var(--accent); box-shadow: 0 0 20px 4px rgba(79,209,197,.9); }
  /* "1拍目だけ違う音" がオフのときは1拍目も他と同じ見た目にする */
  .beat-dots.no-accent .beat-dot.accent { box-shadow: none; }
  .beat-dots.no-accent .beat-dot.accent.on { background: var(--accent-2); box-shadow: 0 0 14px 2px rgba(127,156,245,.8); }

  .metro-controls { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 4px; }
  .btn.metro-main, .btn.metro-stop, .btn.metro-next { height: 58px; justify-content: center; border-radius: 14px; }
  .btn.metro-main { min-width: 180px; font-size: 1.15rem; letter-spacing: .04em; }
  .btn.metro-stop { min-width: 112px; font-size: 1.05rem; }
  .btn.metro-next { padding: 0 18px; }
  /* 再生中は「一時停止」ボタンとして、塗りつぶしではなく枠線スタイルで表示 */
  .btn.metro-main.running { background: var(--panel-2); color: var(--accent); border: 2px solid var(--accent); }

  .metro-settings { margin-top: 20px; padding-top: 16px; border-top: 1px solid #2c3546; }
  .settings-group + .settings-group { margin-top: 18px; padding-top: 16px; border-top: 1px dashed #2c3546; }
  .settings-title { color: var(--text); font-size: .95rem; font-weight: 600; margin-bottom: 12px; text-align: center; }
  .lock-note { background: rgba(245,101,101,.1); border: 1px solid rgba(245,101,101,.35); color: #f5a3a3; border-radius: 8px;
    padding: 8px 10px; font-size: .82rem; margin-bottom: 12px; text-align: center; line-height: 1.5; }
  .sound-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px 22px; margin-bottom: 14px; }
  .sound-grid .option { justify-content: space-between; }
  .sound-grid .option input[type="range"] { flex: 1; width: auto; min-width: 80px; }
  .sound-grid .option .time { min-width: 56px; }
  .check { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-size: .92rem; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

  .program-label { text-align: center; color: var(--muted); font-size: .78rem; margin: 2px 0 10px; line-height: 1.5; }
  .program-steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 4px; }
  .program-step { display: flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid #2c3546; border-radius: 8px; padding: 7px 10px; transition: border-color .15s; }
  .program-step:focus-within { border-color: var(--accent); }
  .program-step .step-num { color: var(--muted); font-size: .8rem; min-width: 16px; }
  .step-bpm { width: 56px; background: transparent; color: var(--text); border: none; border-bottom: 1px solid #3a4558; text-align: center; padding: 2px 0; font-weight: 600; }
  .step-bpm::placeholder { color: #566073; font-weight: 400; }
  .step-sec-wrap { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .step-sec { width: 38px; background: transparent; color: var(--text); border: none; border-bottom: 1px solid #3a4558; text-align: center; padding: 2px 0; }
  .step-sec-unit { color: var(--muted); font-size: .75rem; }
  .program-steps.click-mode .step-sec-wrap { display: none; }

  .playlist-section { margin-top: 12px; background: var(--panel); border-radius: var(--radius); padding: 14px; }
  .playlist-header { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
  .playlist { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; }
  .playlist li { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  .playlist li:hover { background: var(--panel-2); }
  .playlist li.current { background: #1c3336; color: var(--accent); }
  .playlist .idx { color: var(--muted); min-width: 26px; font-variant-numeric: tabular-nums; font-size: .85rem; }
  .playlist .name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .playlist .path { color: var(--muted); font-size: .75rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 30%; }
  .playlist .dur { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
  .playlist .remove { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .playlist .remove:hover { color: var(--danger); background: #2b1f24; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; font-size: .9rem; }

  .download-fab { position: fixed; right: 18px; bottom: 18px; z-index: 1000;
    display: inline-flex; align-items: center; gap: 8px; padding: 13px 20px;
    border-radius: 999px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b0f16; font-weight: 700; font-size: .95rem; text-decoration: none;
    box-shadow: 0 8px 20px rgba(0,0,0,.4); transition: transform .08s, filter .15s; }
  .download-fab:hover { filter: brightness(1.08); }
  .download-fab:active { transform: scale(.96); }

  @media (max-width: 520px) {
    #spectrum { height: 130px; }
    .icon-btn { width: 42px; height: 42px; }
    .icon-btn.big { width: 56px; height: 56px; }
    .playlist .path { display: none; }
    .download-fab { right: 12px; bottom: 12px; padding: 11px 16px; font-size: .88rem; }
  }
</style>
</head>
<body>
<main class="player">
  <header class="player-header">
    <h1>♪ Simple <span>Music Player</span></h1>
  </header>

  <section id="drop-zone" class="drop-zone" aria-label="音楽ファイルの追加">
    <p class="drop-hint">ここに音楽ファイル / フォルダ / ZIPをドラッグ＆ドロップ（MP3のみ対応、ZIP内のMP3も可）</p>
    <div class="upload-buttons">
      <label class="btn primary" for="file-input">🎵 ファイル / ZIPを選択（複数可）</label>
      <input type="file" id="file-input" multiple hidden
             accept="audio/mpeg,.mp3,.zip,application/zip,application/x-zip-compressed">
      <label class="btn" for="folder-input">📁 フォルダを選択</label>
      <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>

  <section class="metronome" aria-label="メトロノーム">
    <div class="metronome-top">
      <div class="metronome-header">🎼 メトロノーム</div>
      <button id="metro-settings-toggle" class="btn" type="button" aria-expanded="false" aria-controls="metro-settings">⚙ 設定を表示</button>
    </div>

    <div id="program-status" class="program-status"></div>
    <div id="beat-dots" class="beat-dots" aria-hidden="true"></div>

    <div class="metro-controls">
      <button id="metro-main-btn" class="btn primary metro-main" type="button" title="メトロノームを開始">▶ START</button>
      <button id="metro-stop-btn" class="btn danger metro-stop" type="button" title="停止" disabled>⏹ 停止</button>
      <button id="next-tempo-btn" class="btn metro-next" type="button" hidden disabled>次のテンポへ ⏭</button>
    </div>

    <div id="metro-settings" class="metro-settings" hidden>
      <div class="settings-group">
        <div class="settings-title">テンポ</div>
        <div id="tempo-lock-note" class="lock-note" hidden>🔒 再生中・一時停止中はテンポの設定を変更できません。変更するには「停止」してください。</div>

        <div class="metronome-row">
          <label class="option">拍子
            <select id="beats-select" aria-label="1小節の拍数">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4" selected>4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="12">12</option>
            </select>
            <span class="time-sep">/</span>
            <select id="note-value-select" aria-label="何分音符を1拍とするか">
              <option value="2">2</option>
              <option value="4" selected>4</option>
              <option value="8">8</option>
              <option value="16">16</option>
            </select>
          </label>
          <label class="option">切替方法
            <select id="advance-mode-select" aria-label="プログラムの切替方法">
              <option value="time">時間で切替</option>
              <option value="click">クリックで切替</option>
            </select>
          </label>
          <button id="tap-tempo-btn" class="btn" type="button" title="連続でタップしてテンポを計測">👆 タップでテンポ</button>
        </div>

        <div class="program-label">テンポ・プログラム（最大10ステップ。空欄はスキップ、1つだけならそのまま停止するまでループ。10番目の次は1番目に戻ります）</div>
        <div id="program-steps" class="program-steps"></div>
      </div>

      <div class="settings-group">
        <div class="settings-title">音</div>
        <div class="sound-grid">
          <label class="option">音色
            <select id="sound-type" aria-label="メトロノームの音色">
              <option value="wood" selected>ウッドブロック</option>
              <option value="beep">ビープ</option>
              <option value="click">クリック</option>
              <option value="hat">ハイハット</option>
            </select>
          </label>
          <label class="option">音量
            <input type="range" id="sound-volume" min="0" max="100" step="1" value="80" aria-label="メトロノームの音量">
            <span id="sound-volume-value" class="time">80%</span>
          </label>
          <label class="option">高さ
            <input type="range" id="sound-pitch" min="-12" max="12" step="1" value="0" aria-label="メトロノームの音の高さ（半音単位）">
            <span id="sound-pitch-value" class="time">±0</span>
          </label>
          <label class="option">長さ
            <input type="range" id="sound-decay" min="50" max="200" step="5" value="100" aria-label="メトロノームの音の長さ">
            <span id="sound-decay-value" class="time">100%</span>
          </label>
        </div>
        <div class="metronome-row">
          <label class="check"><input type="checkbox" id="sound-accent" checked> 1拍目だけ違う音にする</label>
          <button id="sound-test-btn" class="btn" type="button">🔊 試し聴き</button>
        </div>
      </div>
    </div>
  </section>

  <section class="now-playing" aria-label="再生中">
    <canvas id="spectrum" aria-label="スペクトラム表示"></canvas>
    <div id="track-title" class="track-title">曲が選択されていません</div>
    <div id="track-sub" class="track-sub"></div>
  </section>

  <section class="controls" aria-label="再生コントロール">
    <div class="seek-row">
      <span id="current-time" class="time">0:00</span>
      <input type="range" id="seek-bar" min="0" max="1000" value="0" step="1" aria-label="シークバー">
      <span id="duration" class="time">0:00</span>
    </div>

    <div class="button-row">
      <button id="prev-btn" class="btn icon-btn" type="button" title="前の曲">⏮</button>
      <button id="play-btn" class="btn icon-btn big primary" type="button" title="再生 / 一時停止">▶</button>
      <button id="next-btn" class="btn icon-btn" type="button" title="次の曲">⏭</button>
      <button id="loop-btn" class="btn icon-btn" type="button" title="ループ: オフ">🔁</button>
    </div>

    <div class="option-row">
      <label class="option">
        <button id="mute-btn" class="btn icon-btn" type="button" title="ミュート" style="width:38px;height:38px;font-size:1rem;">🔊</button>
        <input type="range" id="volume-slider" min="0" max="100" value="80" aria-label="音量">
        <span id="volume-value" class="time">80%</span>
      </label>
    </div>
    <div class="kbd-hint"><kbd>Space</kbd> 再生/停止 &nbsp; <kbd>←</kbd><kbd>→</kbd> 5秒シーク &nbsp; <kbd>↑</kbd><kbd>↓</kbd> 音量</div>
  </section>

  <section class="playlist-section" aria-label="プレイリスト">
    <div class="playlist-header">
      <span>プレイリスト</span>
      <span id="playlist-count">0 曲</span>
      <button id="playlist-clear-btn" class="btn danger" type="button" hidden>🗑 すべて削除</button>
    </div>
    <ol id="playlist" class="playlist"></ol>
  </section>
</main>

<!-- TODO: replace this href with the actual destination URL -->
<a id="download-audio-btn" class="download-fab" href="https://example.com/" target="_blank" rel="noopener noreferrer">⬇ 音源をダウンロード</a>

<audio id="audio" preload="metadata"></audio>

<script>
(function () {
  'use strict';
  var AUDIO_EXT = ['mp3'];
  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio');
  var fileInput = $('file-input');
  var folderInput = $('folder-input');
  var dropZone = $('drop-zone');
  var statusEl = $('status');
  var canvas = $('spectrum');
  var ctx2d = canvas.getContext('2d');
  var trackTitle = $('track-title');
  var trackSub = $('track-sub');
  var seekBar = $('seek-bar');
  var currentTimeEl = $('current-time');
  var durationEl = $('duration');
  var playBtn = $('play-btn');
  var prevBtn = $('prev-btn');
  var nextBtn = $('next-btn');
  var loopBtn = $('loop-btn');
  var muteBtn = $('mute-btn');
  var volumeSlider = $('volume-slider');
  var volumeValue = $('volume-value');
  var playlistEl = $('playlist');
  var playlistCount = $('playlist-count');
  var playlistClearBtn = $('playlist-clear-btn');
  var tapTempoBtn = $('tap-tempo-btn');
  var beatsSelect = $('beats-select');
  var noteValueSelect = $('note-value-select');
  var advanceModeSelect = $('advance-mode-select');
  var programStepsEl = $('program-steps');
  var nextTempoBtn = $('next-tempo-btn');
  var programStatusEl = $('program-status');
  var metroMainBtn = $('metro-main-btn');
  var metroStopBtn = $('metro-stop-btn');
  var settingsToggleBtn = $('metro-settings-toggle');
  var settingsPanel = $('metro-settings');
  var tempoLockNote = $('tempo-lock-note');
  var soundTypeSelect = $('sound-type');
  var soundVolumeInput = $('sound-volume');
  var soundVolumeValue = $('sound-volume-value');
  var soundPitchInput = $('sound-pitch');
  var soundPitchValue = $('sound-pitch-value');
  var soundDecayInput = $('sound-decay');
  var soundDecayValue = $('sound-decay-value');
  var soundAccentInput = $('sound-accent');
  var soundTestBtn = $('sound-test-btn');
  var beatDotsEl = $('beat-dots');
  var tracks = [];
  var currentIndex = -1;
  var loopMode = 'off';
  var seeking = false;
  var nextId = 1;
  var audioCtx = null, analyser = null, sourceNode = null, freqData = null;
  var autoplayBlocked = false;
  function fmtTime(sec) {
    if (!isFinite(sec) || sec < 0) return '0:00';
    sec = Math.floor(sec);

    var s = metroCtx.createBufferSource(), f = metroCtx.createBiquadFilter(), g = metroCtx.createGain();
    s.buffer = metroNoiseBuf;
    f.type = filterType; f.frequency.value = Math.min(freq, 20000); f.Q.value = q;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.001 + decay);
    s.connect(f); f.connect(g); g.connect(dest);
    s.start(t, Math.random() * 0.3); s.stop(t + 0.001 + decay + 0.05);
  }
  function playClick(t, isAccent, dest) {
    var p = soundCfg.pitch, d = soundCfg.decay, a = isAccent;
    var level = a ? 1.0 : 0.72;
    if (soundCfg.type === 'beep') {
      var fb = (a ? 1320 : 880) * p;
      envTone(dest, t, fb, 'sine', level * 0.9, 0.075 * d);
      envTone(dest, t, fb * 2, 'sine', level * 0.18, 0.04 * d);
    } else if (soundCfg.type === 'click') {
      envNoise(dest, t, 'bandpass', (a ? 3800 : 2800) * p, 1.1, level, 0.018 * d);
      envTone(dest, t, (a ? 2200 : 1500) * p, 'sine', level * 0.6, 0.025 * d);
    } else if (soundCfg.type === 'hat') {
      var hd = (a ? 0.07 : 0.035) * d;
      envNoise(dest, t, 'highpass', 6500 * p, 0.7, level * 0.9, hd);
      envNoise(dest, t, 'bandpass', 10000 * p, 2, level * 0.3, hd);
    } else {
      // Wood block: a solid fundamental, an inharmonic overtone and a tiny "knock".
      var fw = (a ? 1500 : 1000) * p;
      envTone(dest, t, fw, 'sine', level * 0.85, 0.09 * d);
      envTone(dest, t, fw * 2.42, 'sine', level * 0.3, 0.04 * d);
      envNoise(dest, t, 'bandpass', fw * 2.2, 1.5, level * 0.35, 0.012 * d);
    }
  }

  function openBus() {
    metroBus = metroCtx.createGain();
    metroBus.connect(metroMaster);
  }
  // Mute the run bus right away so clicks already queued ahead of time don't
  // sound after the person pressed pause / stop.
  function closeBus() {
    if (!metroBus) return;
    var b = metroBus; metroBus = null;
    b.gain.cancelScheduledValues(metroCtx.currentTime);
    b.gain.setTargetAtTime(0, metroCtx.currentTime, 0.005);
    setTimeout(function () { try { b.disconnect(); } catch (e) {} }, 150);
  }

  function flashBeat(i) {
    var dots = beatDotsEl.children;
    for (var k = 0; k < dots.length; k++) dots[k].classList.remove('on');
    if (dots[i]) dots[i].classList.add('on');
  }
  function clearBeatFlash() {
    var dots = beatDotsEl.children;
    for (var k = 0; k < dots.length; k++) dots[k].classList.remove('on');
  }
  function scheduleClick(beatIndex, time) {
    var isAccent = soundCfg.accent && beatIndex === 0;   // beat 1 differs only if enabled
    playClick(time, isAccent, metroBus);
    var delayMs = Math.max(0, (time - metroCtx.currentTime) * 1000);
    setTimeout(function () { if (metroState === 'running') flashBeat(beatIndex); }, delayMs);
  }
  function metroScheduler() {
    var beatsPerMeasure = parseInt(beatsSelect.value, 10) || 4;
    var noteValue = parseInt(noteValueSelect.value, 10) || 4;
    var bpm = clampBpm((metroSteps[metroStepIndex] && metroSteps[metroStepIndex].bpm) || 120);
    var secPerBeat = (60 / bpm) * (4 / noteValue);
    while (metroNextTime < metroCtx.currentTime + METRO_SCHEDULE_AHEAD_SEC) {
      scheduleClick(metroBeatIndex, metroNextTime);
      metroNextTime += secPerBeat;
      metroBeatIndex = (metroBeatIndex + 1) % beatsPerMeasure;
    }
    metroTimerId = setTimeout(metroScheduler, METRO_LOOKAHEAD_MS);
  }
  function advanceStep() {
    // Wraps from the last configured step back to the first (step 10 → step 1, or
    // fewer if not all 10 slots are filled in).
    if (metroSteps.length <= 1) return;
    metroStepIndex = (metroStepIndex + 1) % metroSteps.length;
    updateProgramStatus();
  }
  function scheduleStepAdvance() {
    if (metroStepTimerId) { clearTimeout(metroStepTimerId); metroStepTimerId = null; }
    if (advanceModeSelect.value !== 'time' || metroSteps.length <= 1) return;
    var cur = metroSteps[metroStepIndex];
    var sec = Math.max(1, (cur && cur.sec) || 8);
    metroStepTimerId = setTimeout(function () {
      advanceStep();
      scheduleStepAdvance();
    }, sec * 1000);
  }

  // --- State / UI ------------------------------------------------------
  function setTempoLocked(locked) {
    beatsSelect.disabled = locked;
    noteValueSelect.disabled = locked;
    advanceModeSelect.disabled = locked;
    var inputs = programStepsEl.querySelectorAll('input');
    for (var i = 0; i < inputs.length; i++) inputs[i].disabled = locked;
    tempoLockNote.hidden = !locked;
    tapTempoBtn.hidden = locked;
  }
  function setMetroState(state) {
    metroState = state;
    metroMainBtn.classList.toggle('running', state === 'running');
    if (state === 'running') { metroMainBtn.textContent = '⏸ 一時停止'; metroMainBtn.title = '一時停止'; }
    else if (state === 'paused') { metroMainBtn.textContent = '▶ 再開'; metroMainBtn.title = '再開'; }
    else { metroMainBtn.textContent = '▶ START'; metroMainBtn.title = 'メトロノームを開始'; }
    metroStopBtn.disabled = state === 'stopped';
    nextTempoBtn.disabled = state !== 'running';
    setTempoLocked(state !== 'stopped');
    updateProgramStatus();
  }
  function startMetronome() {
    if (metroState === 'running') return;
    if (!ensureMetroCtx()) return;
    if (metroState === 'stopped') {
      // Fresh start (not resuming from pause): read the tempo program.
      metroSteps = parseProgram();
      metroStepIndex = 0;
      metroBeatIndex = 0;
    }
    openBus();
    metroNextTime = metroCtx.currentTime + 0.05;
    setMetroState('running');
    metroScheduler();
    scheduleStepAdvance();
  }
  function pauseMetronome() {
    if (metroState !== 'running') return;
    if (metroTimerId) { clearTimeout(metroTimerId); metroTimerId = null; }
    if (metroStepTimerId) { clearTimeout(metroStepTimerId); metroStepTimerId = null; }
    closeBus();
    clearBeatFlash();
    setMetroState('paused');
  }
  function stopMetronome() {
    if (metroTimerId) { clearTimeout(metroTimerId); metroTimerId = null; }
    if (metroStepTimerId) { clearTimeout(metroStepTimerId); metroStepTimerId = null; }
    if (metroCtx) closeBus();
    metroStepIndex = 0;
    metroBeatIndex = 0;
    clearBeatFlash();
    setMetroState('stopped');
  }

  metroMainBtn.addEventListener('click', function () {
    if (metroState === 'running') pauseMetronome(); else startMetronome();
  });
  metroStopBtn.addEventListener('click', stopMetronome);
  nextTempoBtn.addEventListener('click', advanceStep);

  settingsToggleBtn.addEventListener('click', function () {
    var willOpen = settingsPanel.hidden;
    settingsPanel.hidden = !willOpen;
    settingsToggleBtn.setAttribute('aria-expanded', String(willOpen));
    settingsToggleBtn.textContent = willOpen ? '⚙ 設定を隠す' : '⚙ 設定を表示';
  });

  beatsSelect.addEventListener('change', function () { renderBeatDots(); updateProgramStatus(); });
  noteValueSelect.addEventListener('change', updateProgramStatus);
  advanceModeSelect.addEventListener('change', updateAdvanceModeUI);
  programStepsEl.addEventListener('input', updateProgramStatus);

  [soundTypeSelect, soundVolumeInput, soundPitchInput, soundDecayInput, soundAccentInput].forEach(function (el) {
    el.addEventListener('input', readSoundCfg);
    el.addEventListener('change', readSoundCfg);
  });
  soundTestBtn.addEventListener('click', function () {
    if (!ensureMetroCtx()) return;
    var t = metroCtx.currentTime + 0.03;
    for (var i = 0; i < 3; i++) playClick(t + i * 0.4, soundCfg.accent && i === 0, metroMaster);
  });

  // Tap tempo: tap the button a few times in rhythm; the average interval becomes the tempo.
  var tapTimes = [];
  tapTempoBtn.addEventListener('click', function () {
    var now = performance.now();
    if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > 2000) tapTimes = [];
    tapTimes.push(now);
    if (tapTimes.length > 8) tapTimes.shift();
    if (tapTimes.length >= 2) {
      var intervals = [];
      for (var i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i - 1]);
      var avg = intervals.reduce(function (a, b) { return a + b; }, 0) / intervals.length;
      var bpm = clampBpm(60000 / avg);
      var step1 = $('step-bpm-1');
      if (step1) step1.value = String(bpm);
      updateProgramStatus();
      setStatus('タップテンポ: ' + bpm + ' BPM');
    } else {
      setStatus('タップテンポ: もう一度タップしてください');
    }
  });

  renderBeatDots();
  updateAdvanceModeUI();
  readSoundCfg();
  setMetroState('stopped');

  var BAR_COUNT = 64;
  var smoothed = new Float32Array(BAR_COUNT);
  var lastFrameTime = 0;
  function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth || 600, h = canvas.clientHeight || 180;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    }
  }
  function drawSpectrum(now) {
    requestAnimationFrame(drawSpectrum);
    resizeCanvas();
    var dt = lastFrameTime ? Math.min(1 / 15, (now - lastFrameTime) / 1000) : 1 / 60;
    lastFrameTime = now;
    var W = canvas.width, H = canvas.height;
    ctx2d.clearRect(0, 0, W, H);
    var active = analyser && !audio.paused;
    if (active) analyser.getByteFrequencyData(freqData);
    var usable = freqData ? Math.floor(freqData.length * 0.7) : 0;
    var gap = W * 0.004, barW = (W - gap * (BAR_COUNT + 1)) / BAR_COUNT;
    var grad = ctx2d.createLinearGradient(0, H, 0, 0);
    grad.addColorStop(0, '#4fd1c5'); grad.addColorStop(0.6, '#7f9cf5'); grad.addColorStop(1, '#f687b3');
    ctx2d.fillStyle = grad;
    // Symmetric attack/release easing (framerate-independent) for a fluid, non-jittery motion.
    var attackRate = 1 - Math.pow(0.001, dt);   // fast rise
    var releaseRate = 1 - Math.pow(0.06, dt);   // gentle fall
    for (var i = 0; i < BAR_COUNT; i++) {
      var v = 0;
      if (active && usable) {
        var start = Math.floor(Math.pow(i / BAR_COUNT, 1.6) * usable);
        var end = Math.max(start + 1, Math.floor(Math.pow((i + 1) / BAR_COUNT, 1.6) * usable));
        var sum = 0; for (var k = start; k < end; k++) sum += freqData[k];
        v = sum / (end - start) / 255;
      }
      var rate = v > smoothed[i] ? attackRate : releaseRate;
      smoothed[i] += (v - smoothed[i]) * rate;
      var bh = Math.max(2 * (window.devicePixelRatio || 1), smoothed[i] * (H - 8));
      var x = gap + i * (barW + gap);
      var r = Math.min(barW / 2, 4);
      ctx2d.beginPath();
      ctx2d.moveTo(x, H); ctx2d.lineTo(x, H - bh + r); ctx2d.quadraticCurveTo(x, H - bh, x + r, H - bh);
      ctx2d.lineTo(x + barW - r, H - bh); ctx2d.quadraticCurveTo(x + barW, H - bh, x + barW, H - bh + r);
      ctx2d.lineTo(x + barW, H); ctx2d.closePath(); ctx2d.fill();
    }
  }
  requestAnimationFrame(drawSpectrum);

  setVolume(80); setLoopMode('off'); renderPlaylist(); updatePlayButton();

})();
</script>
</body>
</html>
